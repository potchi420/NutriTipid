<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logs - NutriTipid</title>
<meta name="description" content="Price trails and clinic views, kept on record.">
<link rel="icon" href="../assets/img/logo_tight.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
/* Theme: same saved choice as the rest of the site, no framework. */
try {
  var t = localStorage.getItem("nutritipid-theme");
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.setAttribute("data-theme", "dark");
} catch (e) {}
</script>
<link rel="stylesheet" href="../assets/css/styles.css">
<link rel="stylesheet" href="../assets/css/auth.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="../index.html" aria-label="NutriTipid home">
      <img src="../assets/img/logo_tight.svg" alt="NutriTipid" class="brand-logo" width="543" height="493">
    </a>
    <nav class="app-nav" aria-label="App">
      <a href="admin.html" class="header-link">Board</a>
      <a href="admin-logs.html" class="header-link is-active" aria-current="page">Logs</a>
      <a href="admin-users.html" class="header-link">Users</a>
    </nav>
    <div class="header-actions">
      <button id="themeBtn" class="theme-btn" aria-label="Switch color mode">
        <svg id="themeMoon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg id="themeSun" class="is-hidden" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span id="themeLabel">Dark</span>
      </button>
      <a href="login.html" class="header-link">Log out</a>
    </div>
  </div>
</header>

<main class="admin-wrap">
  <h1>Logs.</h1>
  <p class="auth-sub">Price trails and clinic views, kept on record.</p>

  <section class="panel admin-sec">
    <div class="panel-head">
      <h2>Price history</h2>
      <span class="count-line" id="historyTally"></span>
    </div>
    <div id="historyList"></div>
    <p class="report-note">Append-only. Price trails never rewind.</p>
  </section>

  <section class="panel admin-sec">
    <div class="panel-head">
      <h2>Access log</h2>
      <span class="count-line" id="accessTally"></span>
    </div>
    <div id="accessList"></div>
    <p class="report-note">Read-only. Clinic views never edit.</p>
  </section>
</main>

<script src="../assets/js/clinic.js"></script>
<script src="../assets/js/board.js"></script>
<script>
/* Admin logs prototype: read-only review of audit trails. */
(function () {
  "use strict";
  var C = window.NutriTipidClinic;

  /* Price history: the full trail, newest first. */
  function renderHistory() {
    var box = document.getElementById("historyList");
    var tally = document.getElementById("historyTally");
    box.innerHTML = "";
    var h = window.NutriTipidBoard.history();
    if (!h.length) {
      var none = document.createElement("p");
      none.className = "report-note";
      none.textContent = "No price changes yet.";
      box.appendChild(none);
      tally.textContent = "Nothing on record yet.";
      return;
    }
    h.forEach(function (en) {
      var line = document.createElement("div");
      line.className = "log-line";
      var left = document.createElement("span");
      left.textContent = en.food + " \u00B7 P" + (en.old === null ? "\u2014" : en.old) + " \u2192 P" + en.new + " \u00B7 by " + en.by;
      var right = document.createElement("span");
      right.className = "tabular";
      right.textContent = en.at;
      line.appendChild(left); line.appendChild(right);
      box.appendChild(line);
    });
    tally.textContent = h.length + " on record.";
  }
  renderHistory();

  /* Access log: the clinic's views, audited here. */
  function renderAccess() {
    var box = document.getElementById("accessList");
    var tally = document.getElementById("accessTally");
    box.innerHTML = "";
    var recent = C ? C.recentLog() : [];
    if (!recent.length) {
      var none = document.createElement("p");
      none.className = "report-note";
      none.textContent = "No clinic views logged yet.";
      box.appendChild(none);
      tally.textContent = "No views logged yet.";
      return;
    }
    recent.forEach(function (en) {
      var line = document.createElement("div");
      line.className = "log-line";
      var left = document.createElement("span");
      left.textContent = en.patient + " \u00B7 " + en.action + " \u00B7 by " + en.viewer;
      var right = document.createElement("span");
      right.className = "tabular";
      right.textContent = en.at;
      line.appendChild(left); line.appendChild(right);
      box.appendChild(line);
    });
    tally.textContent = recent.length + " on record.";
  }
  renderAccess();
})();
</script>
<nav class="tabbar" aria-label="App">
  <a href="admin.html">Board</a>
  <a href="admin-logs.html" class="is-active" aria-current="page">Logs</a>
  <a href="admin-users.html">Users</a>
</nav>
<script src="../assets/js/theme.js"></script>
</body>
</html>
