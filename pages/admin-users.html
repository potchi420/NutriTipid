<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Users - NutriTipid</title>
<meta name="description" content="Accounts across students, clinic, and admin.">
<link rel="icon" href="../assets/img/logo_tight.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
/* Theme: same saved choice as the rest of the site, no framework. */
try {
  var t = localStorage.getItem("nutritipid-theme");
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.setAttribute("data-theme", "dark");
} catch (e) {}
</script>
<link rel="stylesheet" href="../assets/css/styles.css">
<link rel="stylesheet" href="../assets/css/auth.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="../index.html" aria-label="NutriTipid home">
      <img src="../assets/img/logo_tight.svg" alt="NutriTipid" class="brand-logo" width="543" height="493">
    </a>
    <nav class="app-nav" aria-label="App">
      <a href="admin.html" class="header-link">Board</a>
      <a href="admin-logs.html" class="header-link">Logs</a>
      <a href="admin-users.html" class="header-link is-active" aria-current="page">Users</a>
    </nav>
    <div class="header-actions">
      <button id="themeBtn" class="theme-btn" aria-label="Switch color mode">
        <svg id="themeMoon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg id="themeSun" class="is-hidden" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span id="themeLabel">Dark</span>
      </button>
      <a href="login.html" class="header-link">Log out</a>
    </div>
  </div>
</header>

<main class="admin-wrap">
  <h1>Users.</h1>
  <p class="auth-sub">Accounts across students, the clinic, and admins.</p>

  <div class="board-toolbar">
    <div class="board-search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="userSearch" class="auth-input" type="search" placeholder="Search users" aria-label="Search users by name, email, or role">
    </div>
    <span class="count-line" id="userCount" role="status"></span>
  </div>
  <div class="diary admin-list" id="userList"></div>
  <div class="pager" id="userPager"></div>
  <p class="diary-note">Deactivated accounts lose access the next time they sign in.</p>
</main>

<script src="../assets/js/board.js"></script>
<script>
/* Admin users prototype: account list with soft deactivation. */
(function () {
  "use strict";
  var B = window.NutriTipidBoard;
  var ADMIN = "admin@example.com";
  var FALLBACK = ["#8A6D1B", "#3E8E7E", "#7A4A21", "#4C7A45", "#2E7D5B", "#A34A24"];
  var PAGE = 8;
  var state = { q: "", page: 1 };

  var USERS = [
    { name: "Maria Santos", email: "maria@example.com", role: "Student" },
    { name: "Juan Dela Cruz", email: "juan@example.com", role: "Student" },
    { name: "Andrea Lim", email: "andrea@example.com", role: "Student" },
    { name: "Carla Mendez", email: "carla@example.com", role: "Student" },
    { name: "Bea Torres", email: "bea@example.com", role: "Student" },
    { name: "Nico Reyes", email: "nico@example.com", role: "Student" },
    { name: "Liza Santos", email: "liza@example.com", role: "Student" },
    { name: "Marco Reyes", email: "marco@example.com", role: "Student" },
    { name: "University Clinic", email: "clinic@example.com", role: "Clinic viewer" },
    { name: "Administrator", email: ADMIN, role: "Admin" }
  ];
  var userListEl = document.getElementById("userList");
  var userCountEl = document.getElementById("userCount");
  var userSearchEl = document.getElementById("userSearch");
  var userPagerEl = document.getElementById("userPager");

  function accountList() {
    var list = USERS.slice();
    var seen = {};
    USERS.forEach(function (u) { seen[u.email] = true; });
    var acc = null;
    try { acc = JSON.parse(localStorage.getItem("nutritipid-account") || "null"); } catch (e) {}
    if (acc && acc.email && !seen[acc.email]) {
      list.push({ name: acc.name || "Member", email: acc.email, role: acc.role === "clinic" ? "Clinic viewer" : "Student" });
    }
    return list;
  }

  function matches(u) {
    if (!state.q) return true;
    var hay = (u.name + " " + u.email + " " + u.role).toLowerCase();
    return hay.indexOf(state.q.toLowerCase()) >= 0;
  }

  function renderPager(pages) {
    userPagerEl.innerHTML = "";
    if (pages <= 1) return;
    var prev = document.createElement("button");
    prev.type = "button";
    prev.className = "pager-btn";
    prev.textContent = "\u2039";
    prev.setAttribute("aria-label", "Previous page");
    prev.disabled = state.page <= 1;
    prev.addEventListener("click", function () { state.page--; renderUsers(); });
    var next = document.createElement("button");
    next.type = "button";
    next.className = "pager-btn";
    next.textContent = "\u203A";
    next.setAttribute("aria-label", "Next page");
    next.disabled = state.page >= pages;
    next.addEventListener("click", function () { state.page++; renderUsers(); });
    var lab = document.createElement("span");
    lab.className = "tabular";
    lab.textContent = "Page " + state.page + " of " + pages;
    userPagerEl.appendChild(prev); userPagerEl.appendChild(lab); userPagerEl.appendChild(next);
  }

  function renderUsers() {
    var off = B.deactivated();
    var acc = null;
    try { acc = JSON.parse(localStorage.getItem("nutritipid-account") || "null"); } catch (e) {}
    var all = accountList();
    var pool = all.filter(matches);
    var pages = Math.max(1, Math.ceil(pool.length / PAGE));
    if (state.page > pages) state.page = pages;
    userListEl.innerHTML = "";
    if (!pool.length) {
      var none = document.createElement("p");
      none.className = "report-note";
      none.textContent = "No accounts match \u201C" + state.q + "\u201D.";
      userListEl.appendChild(none);
      userCountEl.textContent = "0 of " + all.length + " accounts match.";
      userPagerEl.innerHTML = "";
      return;
    }
    pool.slice((state.page - 1) * PAGE, state.page * PAGE).forEach(function (u) {
      var active = off.indexOf(u.email) < 0;
      var row = document.createElement("div");
      row.className = "meal is-user" + (active ? "" : " is-off");
      var code = 0;
      for (var i = 0; i < u.email.length; i++) code = (code + u.email.charCodeAt(i)) % FALLBACK.length;
      var av = document.createElement("span");
      av.className = "admin-av";
      av.style.background = FALLBACK[code];
      av.textContent = u.name.charAt(0).toUpperCase();
      var who = document.createElement("div");
      who.className = "who";
      var strong = document.createElement("strong");
      strong.textContent = u.name;
      who.appendChild(strong);
      var meta = document.createElement("span");
      meta.textContent = u.email + " \u00B7 Member since Sep 2026";
      who.appendChild(meta);
      var pill = document.createElement("span");
      pill.className = "board-pill" + (u.role === "Student" ? " is-on" : "");
      pill.textContent = u.role;
      who.appendChild(pill);
      var nums = document.createElement("div");
      nums.className = "nums";
      var stateBtn = document.createElement("button");
      stateBtn.type = "button";
      stateBtn.className = "sheet-btn";
      stateBtn.textContent = active ? "Deactivate" : "Activate";
      stateBtn.setAttribute("aria-label", (active ? "Deactivate " : "Activate ") + u.name);
      if (acc && acc.email === u.email && acc.role === "admin") stateBtn.disabled = true;
      stateBtn.addEventListener("click", function () {
        B.toggleDeactivated(u.email);
        renderUsers();
      });
      nums.appendChild(stateBtn);
      row.appendChild(av); row.appendChild(who); row.appendChild(nums);
      userListEl.appendChild(row);
    });
    if (state.q) {
      userCountEl.textContent = pool.length + " of " + all.length + " accounts match.";
    } else {
      var activeCount = all.filter(function (u) { return off.indexOf(u.email) < 0; }).length;
      userCountEl.textContent = all.length + " accounts \u00B7 " + activeCount + " active.";
    }
    renderPager(pages);
  }

  userSearchEl.addEventListener("input", function () {
    state.q = userSearchEl.value.trim();
    state.page = 1;
    renderUsers();
  });
  renderUsers();
})();
</script>
<nav class="tabbar" aria-label="App">
  <a href="admin.html">Board</a>
  <a href="admin-logs.html">Logs</a>
  <a href="admin-users.html" class="is-active" aria-current="page">Users</a>
</nav>
<script src="../assets/js/theme.js"></script>
</body>
</html>
