<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up - NutriTipid</title>
<meta name="description" content="Create your NutriTipid account.">
<link rel="icon" href="../assets/img/logo_tight.svg" type="image/svg+xml">
<link rel="preload" href="../assets/fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>
/* Theme: same saved choice as the rest of the site, no framework. */
try {
  var t = localStorage.getItem("nutritipid-theme");
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.setAttribute("data-theme", "dark");
} catch (e) {}
</script>
<link rel="stylesheet" href="../assets/css/styles.css">
<link rel="stylesheet" href="../assets/css/auth.css">
<link rel="stylesheet" href="../assets/css/legal.css">
</head>
<body class="auth-page">

<main class="auth-wrap">
  <a class="back-link" href="../index.html">&larr; Back to home</a>
  <h1>Create account</h1>
  <p class="auth-sub">Start your NutriTipid plan on any budget</p>

  <div class="auth-card">
    <form id="signupForm" novalidate>
      <label class="auth-label" for="name">Full name</label>
      <input class="auth-input" id="name" name="name" type="text" value="Maria Santos" autocomplete="name" required>

      <label class="auth-label" for="email">Email address</label>
      <input class="auth-input" id="email" name="email" type="email" value="maria@example.com" autocomplete="email" required>

      <label class="auth-label" for="password">Password</label>
      <div class="password-wrap">
        <input class="auth-input" id="password" name="password" type="password" placeholder="At least 6 characters" autocomplete="new-password" required>
        <button type="button" class="show-btn" id="showBtn" aria-label="Show password" aria-pressed="false">
          <svg id="eyeOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg id="eyeClosed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="is-hidden"><path d="M17.94 17.94A10.6 10.6 0 0 1 12 19c-7 0-11-7-11-7a17.6 17.6 0 0 1 4.06-4.94M9.9 4.24A9.5 9.5 0 0 1 12 5c7 0 11 7 11 7a17.7 17.7 0 0 1-2.16 3.19M14.12 14.12A3 3 0 1 1 9.88 9.88"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>

      <label class="auth-label" for="confirm">Confirm password</label>
      <input class="auth-input" id="confirm" name="confirm" type="password" placeholder="Repeat the password" autocomplete="new-password" required>

      <div class="consent-block">
        <label class="agree-row agree-sm is-locked" for="terms" id="termsRow">
          <input type="checkbox" id="terms" name="terms" disabled>
          <span>I have read and agree to the <a href="terms.html" class="link-green" data-legal="terms">Terms of Service</a>.</span>
        </label>

        <label class="agree-row agree-sm is-locked" for="privacy" id="privacyRow">
          <input type="checkbox" id="privacy" name="privacy" disabled>
          <span>I allow NutriTipid to keep my details on this device, as described in the <a href="privacy.html" class="link-green" data-legal="privacy">Privacy Policy</a> and the Data Privacy Act.</span>
        </label>

        <p class="consent-hint">Each box unlocks after you open its policy and read to the end.</p>

        <label class="agree-row agree-main is-locked" for="agreeAll" id="agreeRow">
          <input type="checkbox" id="agreeAll" name="agreeAll" disabled>
          <span>I agree, create my account.</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary auth-submit" id="signupBtn">Sign up free &rarr;</button>

      <div class="divider" aria-hidden="true"><span>or</span></div>

      <button type="button" class="google-btn" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.7-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C41 35.4 44 30.2 44 24c0-1.3-.1-2.7-.4-3.9z"/></svg>
        Continue with Google
      </button>
      <p class="auth-msg" id="authMsg" role="status"></p>
    </form>
    <p class="auth-switch">Already have an account? <a href="login.html" class="link-green">Log in</a></p>
  </div>
  <p class="auth-legal"><a href="terms.html" data-legal="terms">Terms of Service</a> &middot; <a href="privacy.html" data-legal="privacy">Privacy Policy</a></p>
</main>

<div class="legal-overlay" id="legalOverlay" hidden>
  <div class="legal-dialog" role="dialog" aria-modal="true" aria-labelledby="legalTitle" tabindex="-1">
    <div class="legal-dialog-head">
      <h2 id="legalTitle">Terms of Service</h2>
      <button type="button" class="legal-dialog-close" id="legalClose" aria-label="Close">&times;</button>
    </div>
    <div class="legal-dialog-body">
      <iframe id="legalFrame" title="Terms of Service" src="about:blank"></iframe>
    </div>
    <div class="legal-dialog-foot">
      <button type="button" class="btn btn-primary btn-sm" id="legalDone" disabled>Scroll to the end</button>
    </div>
  </div>
</div>

<script>
/* Signup prototype: mock only. No backend, no real registration. */
(function () {
  "use strict";
  var form = document.getElementById("signupForm");
  var name = document.getElementById("name");
  var email = document.getElementById("email");
  var password = document.getElementById("password");
  var confirm = document.getElementById("confirm");
  var terms = document.getElementById("terms");
  var privacy = document.getElementById("privacy");
  var agreeAll = document.getElementById("agreeAll");
  var agreeRow = document.getElementById("agreeRow");
  var msg = document.getElementById("authMsg");
  var signupBtn = document.getElementById("signupBtn");
  var showBtn = document.getElementById("showBtn");
  var eyeOpen = document.getElementById("eyeOpen");
  var eyeClosed = document.getElementById("eyeClosed");

  function error(text) {
    msg.classList.remove("is-ok");
    msg.classList.add("is-error");
    msg.textContent = text;
  }
  function ok(text) {
    msg.classList.remove("is-error");
    msg.classList.add("is-ok");
    msg.textContent = text;
  }

  /* Show or hide password. Real toggle, local only. */
  if (showBtn && password) {
    showBtn.addEventListener("click", function () {
      var show = password.type === "password";
      password.type = show ? "text" : "password";
      showBtn.setAttribute("aria-pressed", String(show));
      showBtn.setAttribute("aria-label", show ? "Hide password" : "Show password");
      eyeOpen.classList.toggle("is-hidden", show);
      eyeClosed.classList.toggle("is-hidden", !show);
      password.focus();
    });
  }

  /* Decorative prototype button. */
  var googleBtn = document.getElementById("googleBtn");
  if (googleBtn) googleBtn.addEventListener("click", function (e) {
    e.preventDefault();
    msg.classList.remove("is-error", "is-ok");
    msg.textContent = "Google sign-up coming soon.";
  });

  /* Two small consents unlock the main agree box. Unticking either one
     locks it again and clears it, so the order cannot be skipped. */
  function syncConsent() {
    var ready = !!(terms && privacy && terms.checked && privacy.checked);
    if (!agreeAll) return;
    agreeAll.disabled = !ready;
    if (agreeRow) agreeRow.classList.toggle("is-locked", !ready);
    if (!ready) agreeAll.checked = false;
  }
  if (terms && privacy && agreeAll) {
    terms.addEventListener("change", syncConsent);
    privacy.addEventListener("change", syncConsent);
    syncConsent();
  }

  /* The two policies open in a small dialog over the form instead of
     sending people to another page mid-signup. */
  var overlay = document.getElementById("legalOverlay");
  var dialogTitle = document.getElementById("legalTitle");
  var frame = document.getElementById("legalFrame");
  var legalClose = document.getElementById("legalClose");
  var legalDone = document.getElementById("legalDone");
  var legalDialog = document.querySelector(".legal-dialog");
  var lastFocus = null;
  var readState = { terms: false, privacy: false };
  var currentKind = "terms";

  function setDoneState(kind) {
    if (!legalDone) return;
    var done = !!readState[kind];
    legalDone.disabled = !done;
    legalDone.textContent = done ? "Close" : "Scroll to the end";
  }

  /* Reaching the end of a policy unlocks its consent box. */
  function unlock(kind) {
    if (!readState[kind]) readState[kind] = true;
    var box = kind === "privacy" ? privacy : terms;
    var row = document.getElementById(kind + "Row");
    if (box) box.disabled = false;
    if (row) row.classList.remove("is-locked");
    setDoneState(kind);
  }

  function embedUrl(href) {
    var hash = "";
    var cut = href.indexOf("#");
    if (cut > -1) {
      hash = href.slice(cut);
      href = href.slice(0, cut);
    }
    return href + (href.indexOf("?") > -1 ? "&" : "?") + "embed=1" + hash;
  }

  function legalKind(href) {
    return href.indexOf("privacy") > -1 ? "privacy" : "terms";
  }

  function openLegal(href) {
    if (!overlay || !frame) {
      window.location.href = href;
      return;
    }
    if (overlay.hidden) lastFocus = document.activeElement;
    currentKind = legalKind(href);
    dialogTitle.textContent = currentKind === "privacy" ? "Privacy Policy" : "Terms of Service";
    frame.title = dialogTitle.textContent;
    frame.src = embedUrl(href);
    setDoneState(currentKind);
    overlay.hidden = false;
    document.body.style.overflow = "hidden";
    if (legalDialog) legalDialog.focus();
  }

  function closeLegal() {
    if (!overlay || overlay.hidden) return;
    overlay.hidden = true;
    frame.src = "about:blank";
    document.body.style.overflow = "";
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  Array.prototype.forEach.call(document.querySelectorAll("[data-legal]"), function (link) {
    link.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      openLegal(link.getAttribute("data-legal") === "privacy" ? "privacy.html" : "terms.html");
    });
  });
  if (legalClose) legalClose.addEventListener("click", closeLegal);
  if (legalDone) {
    legalDone.addEventListener("click", function () {
      unlock(currentKind);
      closeLegal();
    });
  }
  if (overlay) {
    overlay.addEventListener("click", function (e) {
      if (e.target === overlay) closeLegal();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !overlay.hidden) {
        e.preventDefault();
        closeLegal();
      }
    });
  }

  /* The dialog's contents ask us to swap documents when one policy links
     to the other. */
  window.addEventListener("message", function (e) {
    if (!e.data || e.data.type !== "nutritipid-legal" || !overlay || overlay.hidden) return;
    if (e.data.action === "close") {
      closeLegal();
      return;
    }
    if (e.data.action === "bottom") {
      if (!e.data.doc || e.data.doc === currentKind) unlock(currentKind);
      return;
    }
    openLegal(String(e.data.href || "terms.html"));
  });

  /* Mock submit: validates shape, then pretends. */
  if (form) {
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (!name.value.trim()) {
        error("Enter your name to continue.");
        name.focus();
        return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) {
        error("Enter a valid email address to continue.");
        email.focus();
        return;
      }
      if (password.value.length < 6) {
        error("Password needs at least 6 characters.");
        password.focus();
        return;
      }
      if (password.value !== confirm.value) {
        error("Passwords do not match. Repeat the same one below.");
        confirm.focus();
        return;
      }
      if (!terms.checked) {
        error("Tick the terms box to continue.");
        terms.focus();
        return;
      }
      if (!privacy.checked) {
        error("Tick the privacy consent to continue.");
        privacy.focus();
        return;
      }
      if (!agreeAll.checked) {
        error("Tick the agree box to continue.");
        agreeAll.focus();
        return;
      }
      signupBtn.disabled = true;
      signupBtn.textContent = "Creating account...";
      setTimeout(function () {
        signupBtn.disabled = false;
        signupBtn.innerHTML = "Sign up free &rarr;";
        /* Identity sticks in its own record; the profiler keeps
            body metrics separate, like AppUsers vs UserProfile. */
        try {
          localStorage.setItem("nutritipid-account", JSON.stringify({
            name: name.value.trim(),
            email: email.value.trim(),
            since: new Date().toISOString().slice(0, 10),
            role: "user",
            onboarded: false
          }));
        } catch (err) {}
        ok("Account created. Setting up your first week...");
        setTimeout(function () { window.location.href = "onboard.html"; }, 900);
      }, 700);
    });
  }
})();
</script>
</body>
</html>
