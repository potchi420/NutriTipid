<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress - NutriTipid</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/img/logo_tight.svg" type="image/svg+xml">
<meta http-equiv="refresh" content="0; url=progress.html">
<script>
/* Weight tracking now lives on the Progress page. Keeps old links working. */
try {
  var t = localStorage.getItem("nutritipid-theme");
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
} catch (e) {}
window.location.replace("progress.html");
</script>
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
<main class="auth-wrap">
  <h1>Progress.</h1>
  <p class="auth-sub">Weight tracking moved to Progress.</p>
  <p style="margin-top:20px"><a class="btn btn-primary" href="progress.html">Open Progress</a></p>
</main>
</body>
</html>
